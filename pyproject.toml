[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miner-ghaw"
version = "0.2.0"
description = "CLI para identificar repositorios que utilizan GitHub Agentic Workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "PyGithub>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<1",
    "PyYAML>=6,<7",
    "pyarrow>=17,<24",
    "httpx>=0.27,<1",
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
publish = ["huggingface-hub>=0.27,<2"]

[project.scripts]
miner = "miner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
